<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="520">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <filter id="neonBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00F2FE" flood-opacity="0.15" />
    </filter>

    <style>
      /* CSS Sequence Timing for Autonomous Agent Simulation */
      /* Total Cycle Duration: 14s */
      
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes animScene1 {
        0% { opacity: 0; transform: translateY(6px); }
        4%, 94% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }

      @keyframes animScene2 {
        0%, 15% { opacity: 0; transform: translateY(6px); }
        20%, 94% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }

      @keyframes animScene3 {
        0%, 40% { opacity: 0; transform: translateY(6px); }
        45%, 94% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }

      @keyframes animScene4 {
        0%, 65% { opacity: 0; transform: translateY(6px); }
        70%, 94% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }

      @keyframes animFinalBadge {
        0%, 82% { opacity: 0; transform: scale(0.92); }
        86%, 94% { opacity: 1; transform: scale(1); }
        98%, 100% { opacity: 0; }
      }

      .cursor {
        animation: blinkCursor 0.8s infinite;
      }

      .scene-1 { animation: animScene1 14s infinite ease-out; }
      .scene-2 { animation: animScene2 14s infinite ease-out; }
      .scene-3 { animation: animScene3 14s infinite ease-out; }
      .scene-4 { animation: animScene4 14s infinite ease-out; }
      .scene-final { animation: animFinalBadge 14s infinite ease-out; }
    </style>
  </defs>

  <!-- Terminal Outer Window Frame -->
  <rect x="4" y="4" width="952" height="512" rx="14" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.5" filter="url(#neonBlur)" />

  <!-- Terminal Title Bar -->
  <rect x="4" y="4" width="952" height="42" rx="14" fill="url(#headerGrad)" />
  <rect x="4" y="32" width="952" height="14" fill="url(#headerGrad)" />
  <line x1="4" y1="46" x2="956" y2="46" stroke="#1f293d" stroke-width="1" />

  <!-- Traffic Lights (macOS buttons) -->
  <circle cx="28" cy="25" r="6" fill="#ef4444" />
  <circle cx="48" cy="25" r="6" fill="#f59e0b" />
  <circle cx="68" cy="25" r="6" fill="#10b981" />

  <!-- Title Center -->
  <text x="480" y="29" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">
    yy@ubuntu-server: ~ (SSH: 192.168.1.100) — AssisSSH Autonomous Copilot
  </text>

  <!-- Right status pill -->
  <rect x="800" y="14" width="138" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" />
  <circle cx="814" cy="25" r="3.5" fill="#10b981" />
  <text x="824" y="29" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#34d399">Gemini 3.5 Copilot</text>

  <!-- ================= TERMINAL CONTENT BODY ================= -->

  <!-- SCENE 1: User Prompt Formulation -->
  <g class="scene-1" transform="translate(36, 80)">
    <!-- User Input Bubble -->
    <rect x="0" y="0" width="888" height="44" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="18" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#a5b4fc">
      👤 User Goal: <tspan fill="#ffffff" font-weight="500">"افحص حاويات Docker وشغل أي حاوية متوقفة وتأكد من عمل الـ API"</tspan>
    </text>
  </g>

  <!-- SCENE 2: AI Diagnostic Step 1 -->
  <g class="scene-2" transform="translate(36, 142)">
    <!-- Step Badge -->
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">
      🤖 AssisSSH [Step 1/3]: <tspan fill="#94a3b8" font-weight="400">Querying Docker daemon status...</tspan>
    </text>
    
    <!-- Shell Command Box -->
    <rect x="0" y="30" width="888" height="66" rx="6" fill="#030712" stroke="#1f2937" />
    <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34d399">
      yy@server:~$ <tspan fill="#f1f5f9">docker ps -a --format "table {{.Names}}\t{{.Status}}"</tspan>
    </text>
    <text x="16" y="74" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#ef4444">
      web_api_backend    Exited (137) 22 minutes ago (OOM Killed)
    </text>
    <text x="450" y="74" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#64748b">
      redis_db    Up 6 hours
    </text>
  </g>

  <!-- SCENE 3: AI Self-Healing Step 2 -->
  <g class="scene-3" transform="translate(36, 256)">
    <!-- Step Badge -->
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f59e0b">
      ⚡ AssisSSH [Step 2/3]: <tspan fill="#94a3b8" font-weight="400">Remediating container &amp; reviewing runtime logs...</tspan>
    </text>
    
    <!-- Shell Command Box -->
    <rect x="0" y="30" width="888" height="66" rx="6" fill="#030712" stroke="#1f2937" />
    <text x="16" y="52" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34d399">
      yy@server:~$ <tspan fill="#f1f5f9">sudo docker start web_api_backend &amp;&amp; docker logs --tail 2 web_api_backend</tspan>
    </text>
    <text x="16" y="74" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#38bdf8">
      ✓ Container 'web_api_backend' restarted. [INFO] Server listening at http://0.0.0.0:8080
    </text>
  </g>

  <!-- SCENE 4: Verification Step 3 -->
  <g class="scene-4" transform="translate(36, 370)">
    <!-- Step Badge -->
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#a855f7">
      🩺 AssisSSH [Step 3/3]: <tspan fill="#94a3b8" font-weight="400">Verifying endpoint health status...</tspan>
    </text>
    
    <!-- Shell Command Box -->
    <rect x="0" y="30" width="888" height="42" rx="6" fill="#030712" stroke="#1f2937" />
    <text x="16" y="56" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34d399">
      yy@server:~$ <tspan fill="#f1f5f9">curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health</tspan> <tspan fill="#10b981" font-weight="700">➔ 200 OK</tspan>
    </text>
  </g>

  <!-- FINAL GLOWING SUCCESS BANNER (Fades in at end of loop) -->
  <g class="scene-final" transform="translate(36, 442)">
    <rect x="0" y="0" width="888" height="52" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1.5" />
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#34d399">
      🎯 تم إنجاز المهمة بنجاح!
      <tspan fill="#e2e8f0" font-weight="500">تم فحص الحاويات وتشغيل web_api_backend والتحقق من سلامة الخدمة بنجاح (3 خطوات منفذة).</tspan>
    </text>
    <!-- Terminal interactive prompt at end -->
    <text x="850" y="32" font-family="'JetBrains Mono', monospace" font-size="16" fill="#00F2FE" class="cursor">▋</text>
  </g>
</svg>
