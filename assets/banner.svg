<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="260">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>

    <!-- Brand Cyan-Indigo Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00F2FE" flood-opacity="0.25" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>

    <style>
      @keyframes floatGlow {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.8; }
        50% { transform: translateY(-4px) scale(1.03); opacity: 1; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes shimmerBorder {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 1000; }
      }
      .floating-logo {
        animation: floatGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .pulsing-led {
        animation: pulseDot 2s infinite ease-in-out;
        transform-origin: center;
      }
      .shimmer-rect {
        stroke-dasharray: 200, 800;
        animation: shimmerBorder 12s linear infinite;
      }
    </style>
  </defs>

  <!-- Container Box with Rounded Glass Border -->
  <rect x="4" y="4" width="952" height="252" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <rect x="4" y="4" width="952" height="252" rx="16" fill="url(#cyberGrid)" />
  
  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="140" cy="130" r="100" fill="url(#glowGrad)" />
  <circle cx="820" cy="130" r="90" fill="#6366f1" opacity="0.08" />

  <!-- Animated Border Highlight -->
  <rect class="shimmer-rect" x="4" y="4" width="952" height="252" rx="16" fill="none" stroke="url(#brandGrad)" stroke-width="1.5" />

  <!-- Left: Glowing Logo Badge -->
  <g class="floating-logo" transform="translate(65, 80)">
    <!-- Hexagonal / Shield Base -->
    <rect x="0" y="0" width="96" height="96" rx="22" fill="#0c1322" stroke="#00f2fe" stroke-width="1.5" filter="url(#dropShadow)" />
    <!-- Inner Accent Glow -->
    <rect x="6" y="6" width="84" height="84" rx="18" fill="rgba(0, 242, 254, 0.08)" />
    <!-- Lightning Bolt / AI Terminal Icon -->
    <path d="M 52 18 L 28 52 L 46 52 L 40 78 L 68 44 L 50 44 Z" fill="url(#brandGrad)" filter="url(#neonGlow)" />
  </g>

  <!-- Center-Right: Title & Typography -->
  <g transform="translate(195, 78)">
    <!-- Main Title -->
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif" font-weight="900" font-size="52" fill="url(#brandGrad)" letter-spacing="-1px">
      AssisSSH
    </text>
    
    <!-- Version Tag -->
    <rect x="250" y="16" width="56" height="24" rx="12" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1" />
    <text x="278" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F2FE" text-anchor="middle">v3.5</text>

    <!-- Subtitle -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="19" fill="#94a3b8" letter-spacing="0.2px">
      Autonomous AI DevOps Engineer &amp; Intelligent SSH Terminal
    </text>
  </g>

  <!-- Bottom Pills / Feature Badges -->
  <g transform="translate(195, 185)">
    <!-- Badge 1: Gemini 3.5 Primary -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="168" height="32" rx="16" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <circle class="pulsing-led" cx="16" cy="16" r="4.5" fill="#10B981" />
      <text x="32" y="20" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#34d399">Gemini 3.5 Active</text>
    </g>

    <!-- Badge 2: Groq 429 Failover -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="160" height="32" rx="16" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />
      <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="13">⚡</text>
      <text x="34" y="20" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#fbbf24">Groq 429 Failover</text>
    </g>

    <!-- Badge 3: Session Memory -->
    <g transform="translate(352, 0)">
      <rect x="0" y="0" width="160" height="32" rx="16" fill="rgba(99, 102, 241, 0.1)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1" />
      <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="13">📂</text>
      <text x="34" y="20" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#a5b4fc">Session Memory</text>
    </g>

    <!-- Badge 4: Telegram Companion -->
    <g transform="translate(524, 0)">
      <rect x="0" y="0" width="174" height="32" rx="16" fill="rgba(14, 165, 233, 0.1)" stroke="rgba(14, 165, 233, 0.3)" stroke-width="1" />
      <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="13">📱</text>
      <text x="34" y="20" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#38bdf8">Telegram Remote</text>
    </g>
  </g>
</svg>
